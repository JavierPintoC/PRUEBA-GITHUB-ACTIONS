on:
  push:
    branches:
    - main
    - release/*

jobs:
  deploy-job:
    runs-on: self-hosted 
    steps:
      - name: Obtener código
        uses: actions/checkout@v3
        
      - name: Test
        run: |
          echo "test"
          
      - name: Build
        run: |
          echo "build"
          docker compose build
          
      - name: Deploy
        run: |
          echo "deploy"
          docker compose down || true
          docker compose up --build -d